name: 'RefactoringMiner Report'
description: 'Detect refactorings in pull requests, post a summary comment, and publish an interactive AST-diff view'
author: 'Parsa Hejazi'

branding:
  icon: 'search'
  color: 'green'

inputs:
  github-token:
    description: 'Token used to post the PR comment and publish the interactive view'
    required: true
    default: ${{ github.token }}
  image:
    description: 'RefactoringMiner Docker image to use (e.g. tsantalis/refactoringminer:3.0.9)'
    required: false
    default: 'tsantalis/refactoringminer:latest'
  enable-web-view:
    description: 'Export the interactive AST-diff view and link it in the PR comment (GitHub Pages when the repo is public and Pages is served from gh-pages, workflow artifact otherwise)'
    required: false
    default: 'true'

runs:
  using: 'node24'
  main: 'dist/index.js'
